### model
# Continue from the video-reasoning SFT checkpoint, then specialize only the
# perception output using the original 768x1440 media.
model_name_or_path: ./saves/qwen35-4b/merged/v35_four_video_context_reasoning_512x960_retrain
trust_remote_code: true
image_min_pixels: 65536
image_max_pixels: 1105920
video_min_pixels: 65536
video_max_pixels: 1105920
video_fps: 1.0
video_maxlen: 6

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
additional_target: null
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_offload_no_persist_config.json
disable_gradient_checkpointing: false
flash_attn: sdpa
enable_liger_kernel: true

### dataset
dataset_dir: ./project/sft_v35_perception_temporal_dataset
media_dir: ./project/sft_v35_perception_temporal_dataset
dataset: v35_perception_temporal_train
eval_dataset: v35_perception_temporal_val
template: qwen3_5_nothink
cutoff_len: 65536
preprocessing_num_workers: 8
dataloader_num_workers: 4
overwrite_cache: true

### output
output_dir: ./saves/qwen35-4b/lora/v35_perception_temporal_highres
logging_steps: 5
save_steps: 100
eval_steps: 100
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_accumulation_steps: 1
save_strategy: steps
