### model
model_name_or_path: /path/to/models/Qwen3.5-9B
trust_remote_code: true
# Preserve the native 768x1440 resolution for still images and every video frame.
# video_max_pixels is a per-frame limit; six frames contain 6,635,520 pixels total.
image_min_pixels: 65536
image_max_pixels: 1105920
video_min_pixels: 65536
video_max_pixels: 1105920
# Each source video is exactly six frames at 1 FPS; preserve all six frames.
video_fps: 1.0
video_maxlen: 6

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
additional_target: null
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
# A single sample contains four native-resolution six-frame videos plus 2-4
# context images. The target is now a compact four-phase LLMLight feature JSON.
# ZeRO-3 CPU offload preserves all visual tokens while freeing the
# parameter/optimizer memory needed by the multimodal input sequence.
deepspeed: examples/deepspeed/ds_z3_offload_no_persist_config.json
disable_gradient_checkpointing: false
flash_attn: sdpa
enable_liger_kernel: true

### dataset
dataset_dir: ./project/sft_v34_four_video_context_llmlight_dataset
media_dir: ./project/sft_v34_four_video_context_llmlight_dataset
dataset: v34_four_video_context_llmlight_train
eval_dataset: v34_four_video_context_llmlight_val
template: qwen3_5_nothink
# Four native-resolution videos plus four images use roughly 18k input tokens;
# the compact LLMLight target stays safely below this 32k limit.
cutoff_len: 32768
preprocessing_num_workers: 8
dataloader_num_workers: 4
overwrite_cache: true

### output
output_dir: ./saves/qwen35-9b/lora/v34_four_video_context_llmlight
logging_steps: 5
save_steps: 100
eval_steps: 100
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_accumulation_steps: 1
save_strategy: steps
